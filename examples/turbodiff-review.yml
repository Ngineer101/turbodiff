# Copy this file into any repository you want Turbodiff to review, as
# .github/workflows/turbodiff-review.yml, then add a TURBODIFF_SECRET
# repository secret (Settings -> Secrets and variables -> Actions) matching
# the Worker's REVIEW_SECRET.
name: Turbodiff review

on:
  pull_request:
    # Add "synchronize" to re-review on every push to the PR branch.
    types: [opened, ready_for_review]

jobs:
  request-review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Ask Turbodiff for a review
        env:
          TURBODIFF_URL: https://turbodiff.YOUR-SUBDOMAIN.workers.dev
          TURBODIFF_SECRET: ${{ secrets.TURBODIFF_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          curl --fail-with-body -sS -X POST "$TURBODIFF_URL/review" \
            -H "Authorization: Bearer $TURBODIFF_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"pr_url\": \"$PR_URL\"}"
