services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: turbodiff
      POSTGRES_USER: turbodiff
      POSTGRES_PASSWORD: turbodiff
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U turbodiff -d turbodiff']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - turbodiff-postgres:/var/lib/postgresql/data

volumes:
  turbodiff-postgres:
