# Production deploy: every push to main first passes the same quality, test,
# build, and dry-run gates as a pull request. It then migrates the existing
# PlanetScale database before deploying the Worker + sandbox image. It never
# provisions a database or Hyperdrive configuration.
#
# Requires three repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit, Containers:Edit
#   CLOUDFLARE_ACCOUNT_ID
#   POSTGRES_DATABASE_URL  — direct PlanetScale PostgreSQL connection
name: Deploy

on:
  push:
    branches: [main]

# Queue deploys instead of interleaving them; never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://turbodiff:turbodiff@127.0.0.1:5432/turbodiff
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turbodiff
          POSTGRES_PASSWORD: turbodiff
          POSTGRES_DB: turbodiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbodiff -d turbodiff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm vp run check:types

      - name: Lint
        run: pnpm vp lint

      - name: Unit tests
        run: pnpm test

      - name: Validate Drizzle migrations
        run: pnpm vp run db:check

      - name: Fresh PostgreSQL schema test
        run: pnpm vp run test:schema

      - name: Worker and PostgreSQL integration tests
        run: pnpm vp run test:worker

      - name: Build
        run: pnpm vp run build

      - name: Validate Worker deployment
        run: pnpm wrangler deploy --dry-run --config dist/turbodiff/wrangler.json

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm vp run db:migrate
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}

      - name: Verify PostgreSQL schema
        run: pnpm vp run db:verify
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}

      - name: Deploy
        run: pnpm vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
