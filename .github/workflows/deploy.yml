# Production deploy: every push to main first passes the same quality, test,
# build, and dry-run gates as a pull request. PlanetScale and Hyperdrive are
# externally managed; this workflow only deploys the Worker + sandbox image.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit, Containers:Edit
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]

# Queue deploys instead of interleaving them; never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm vp run check:types

      - name: Lint
        run: pnpm vp lint

      - name: Unit tests
        run: pnpm test

      - name: Fresh PostgreSQL schema test
        run: pnpm vp run test:schema

      - name: Build
        run: pnpm vp run build

      - name: Validate Worker deployment
        run: pnpm wrangler deploy --dry-run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
