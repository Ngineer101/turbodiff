name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm vp run check:types

      - name: Lint
        run: pnpm vp lint

      - name: Unit tests
        run: pnpm test

      - name: Validate Drizzle migrations
        run: pnpm vp run db:check

      - name: Fresh PostgreSQL schema test
        run: pnpm vp run test:schema

      - name: Build
        run: pnpm vp run build

      - name: Validate Worker deployment
        run: pnpm wrangler deploy --dry-run
